name: Worker fleet preview
on:
  push:
    branches: [codex/preview-batch-recovery]
  workflow_dispatch:
concurrency:
  group: worker-fleet-preview
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clipforge
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b apps/api apps/worker
      - run: pnpm --filter @clipforge/web typecheck
      - run: node --test packages/youtube/test/source.test.mjs packages/youtube/test/quota.test.mjs apps/worker/test/batch-publication.test.mjs apps/api/test/resume-batch.test.mjs
      - run: node apps/api/test/workspace-fleet.isolated.mjs
        env:
          CLIPFORGE_TEST_DB_URL: postgres://clipforge:fixture@127.0.0.1:5432/postgres
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: media-worker
          tags: clipforge-worker:qa
          load: true
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=media-worker
          cache-to: type=gha,mode=max,scope=media-worker
      - run: node scripts/test-worker-container.mjs clipforge-worker:qa
      - run: docker run --rm --entrypoint python -e PYTHONPATH=workers/python clipforge-worker:qa -m unittest discover -s workers/python/tests -p test_container_resources.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested worker only; no platform deployment
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/clipforge-worker"
          docker tag clipforge-worker:qa "$image:$SHA"
          docker tag clipforge-worker:qa "$image:fleet-preview"
          docker push "$image:$SHA"
          docker push "$image:fleet-preview"
