name: Platform managed workers
on:
  push:
    branches: [codex/preview-batch-recovery]
  workflow_dispatch:
concurrency:
  group: worker-fleet-preview
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clipforge
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b apps/api apps/worker
      - run: pnpm --filter @clipforge/web typecheck
      - run: node --test packages/youtube/test/source.test.mjs packages/youtube/test/quota.test.mjs apps/worker/test/batch-publication.test.mjs apps/api/test/resume-batch.test.mjs
      - run: node apps/api/test/workspace-fleet.isolated.mjs
        env:
          CLIPFORGE_TEST_DB_URL: postgres://clipforge:fixture@127.0.0.1:5432/postgres
      - run: node scripts/build-worker-bundle.mjs
      - name: Verify original sound with a real media fixture
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg && node --test apps/worker/test/original-audio.test.mjs
      - name: Verify the small catalog worker
        env:
          CLIPFORGE_TEST_DB_URL: postgres://clipforge:fixture@127.0.0.1:5432/postgres
          CLIPFORGE_REMOTE_CATALOG_TEST: '1'
        run: node apps/api/test/remote-workers.isolated.mjs
      - name: Verify two workers using the exact platform-generated Docker command
        env:
          CLIPFORGE_TEST_DB_URL: postgres://clipforge:fixture@127.0.0.1:5432/postgres
          CLIPFORGE_REMOTE_CONTAINER_TEST: '1'
        run: node apps/api/test/remote-workers.isolated.mjs
