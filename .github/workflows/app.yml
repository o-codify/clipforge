name: ClipForge

on:
  push:
    branches: [main, master]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: clipforge-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image on GitHub
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: docker build --target server --build-arg "RELEASE_SHA=$RELEASE_SHA" -t clipforge:ci .
      - name: Verify retained deployment assets
        run: node --test scripts/test-web-assets.mjs scripts/test-readiness-policy.mjs
      - name: Verify startup, persistence and recovery
        run: node scripts/test-container.mjs clipforge:ci
      - name: Publish tested image
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/clipforge"
          docker tag clipforge:ci "$image:$RELEASE_SHA"
          docker tag clipforge:ci "$image:latest"
          docker push "$image:$RELEASE_SHA"
          docker push "$image:latest"

  deploy:
    needs: [build, media]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy through Coolify and verify the release
        env:
          COOLIFY_APP_WEBHOOK: ${{ secrets.COOLIFY_APP_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/deploy.mjs

  media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - run: pnpm install --frozen-lockfile
      - name: Compile media worker on GitHub
        run: pnpm exec turbo run build --filter=@clipforge/worker...
      - name: Verify streamed publication transport without uploading to YouTube
        run: node --test packages/youtube/test/source.test.mjs
      - name: Verify paced publication and YouTube limit recovery
        run: node --test apps/worker/test/batch-publication.test.mjs
      - name: Verify selection inside game chapters
        run: node --test apps/worker/test/game-selection.test.mjs
      - name: Compile and verify cloud media cache against isolated S3 and PostgreSQL
        env:
          CLIPFORGE_TEST_S3_IMAGE: clipforge-s3-fixture
        run: |
          pnpm exec tsc -b apps/api
          node apps/api/test/publication-feeds.isolated.mjs
          docker build -f scripts/test-s3.Dockerfile -t clipforge-s3-fixture scripts
          node apps/api/test/cloud-cache.isolated.mjs
      - name: Verify bounded native downloads
        run: PYTHONPATH=workers/python python3 -m unittest discover -s workers/python/tests -p test_hls_window.py
      - name: Verify vision model cache and checksums
        run: python3 scripts/test-vision-model.py
      - name: Verify container headroom and model process cleanup
        run: |
          python3 -m pip install psutil==7.2.2
          PYTHONPATH=workers/python python3 -m unittest discover -s workers/python/tests -p test_container_resources.py
      - name: Verify download cap and partial-file recovery
        run: node --experimental-strip-types --test packages/pipeline/test/download-recovery.test.ts
      - name: Verify transcript typography and subtitle masking
        run: node --experimental-strip-types --test packages/pipeline/test/text.test.ts packages/pipeline/test/subtitles.test.ts packages/pipeline/test/port.test.ts
      - name: Verify protection gates and pre-crop masking
        run: node --experimental-strip-types --test packages/pipeline/test/protection.test.ts apps/worker/test/media-review.test.mjs apps/worker/test/render-options.test.mjs
      - name: Verify bounded speech windows and interrupted recognition
        run: PYTHONPATH=workers/python python3 -m unittest discover -s workers/python/tests -p test_resource_windows.py
      - name: Package portable media runtime
        run: node scripts/package-media.mjs
      - name: Verify portable bundle and queue isolation
        run: node dist/media/apps/worker/dist/main.mjs --check-runtime
      - name: Archive prepared runtime
        run: cd dist/media && zip -qr ../clipforge-media.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: clipforge-media-${{ github.sha }}
          path: dist/clipforge-media.zip
          retention-days: 14

  publish-media:
    needs: [media, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clipforge-media-${{ github.sha }}
      - name: Publish prepared worker for the PC to download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          sha256sum clipforge-media.zip > clipforge-media.zip.sha256
          gh release create "media-$RELEASE_SHA" --target "$RELEASE_SHA" --title "Media worker $RELEASE_SHA" --notes "Prepared on GitHub; the PC only downloads and runs this media worker." clipforge-media.zip clipforge-media.zip.sha256
