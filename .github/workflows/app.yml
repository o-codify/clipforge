name: ClipForge

on:
  push:
    branches: [main, master]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: clipforge-production
  cancel-in-progress: false

jobs:
  build-deploy:
    # Dedicated runner on the owner's PC; Docker Desktop builds Linux images.
    runs-on: [self-hosted, Windows, X64, clipforge]
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: docker build --target server --build-arg "RELEASE_SHA=$env:RELEASE_SHA" -t clipforge:ci .
      - name: Verify startup, persistence and recovery
        run: node scripts/test-container.mjs clipforge:ci
      - name: Publish tested image
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $image = "ghcr.io/$($env:OWNER.ToLowerInvariant())/clipforge"
          docker tag clipforge:ci "$($image):$env:RELEASE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker tag clipforge:ci "$($image):latest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push "$($image):$env:RELEASE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker push "$($image):latest"
          exit $LASTEXITCODE
      - name: Deploy and verify this release
        if: ${{ vars.PUBLIC_ORIGIN != '' }}
        env:
          COOLIFY_APP_WEBHOOK: ${{ secrets.COOLIFY_APP_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/deploy.mjs
