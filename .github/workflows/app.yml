name: ClipForge

# CI builds software and checks server startup only. Never download streams,
# process/render/inspect clips, or start media workers here (including fixtures).
# Media processing and media tests run on platform workers or locally.
on:
  push:
    branches: [main, master]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: clipforge-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image on GitHub
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: docker build --target server --build-arg "RELEASE_SHA=$RELEASE_SHA" -t clipforge:ci .
      - name: Verify retained deployment assets
        run: node --test scripts/test-web-assets.mjs scripts/test-readiness-policy.mjs
      - name: Verify startup, persistence and recovery
        run: node scripts/test-container.mjs clipforge:ci
      - name: Publish tested image
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/clipforge"
          docker tag clipforge:ci "$image:$RELEASE_SHA"
          docker tag clipforge:ci "$image:latest"
          docker push "$image:$RELEASE_SHA"
          docker push "$image:latest"

  deploy:
    needs: [build, package-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy through Coolify and verify the release
        env:
          COOLIFY_APP_WEBHOOK: ${{ secrets.COOLIFY_APP_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/deploy.mjs

  package-worker:
    name: Package worker code (no media processing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - run: pnpm install --frozen-lockfile
      - name: Compile worker code without running it
        run: pnpm exec turbo run build --filter=@clipforge/worker...
      - name: Package portable media runtime
        run: node scripts/package-media.mjs
      - name: Archive prepared runtime
        run: cd dist/media && zip -qr ../clipforge-media.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: clipforge-media-${{ github.sha }}
          path: dist/clipforge-media.zip
          retention-days: 14

  publish-media:
    needs: [package-worker, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clipforge-media-${{ github.sha }}
      - name: Publish prepared worker for the PC to download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          sha256sum clipforge-media.zip > clipforge-media.zip.sha256
          gh release create "media-$RELEASE_SHA" --target "$RELEASE_SHA" --title "Media worker $RELEASE_SHA" --notes "Prepared on GitHub; the PC only downloads and runs this media worker." clipforge-media.zip clipforge-media.zip.sha256
