name: ClipForge

on:
  push:
    branches: [main, master]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: clipforge-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image on GitHub
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: docker build --target server --build-arg "RELEASE_SHA=$RELEASE_SHA" -t clipforge:ci .
      - name: Verify startup, persistence and recovery
        run: node scripts/test-container.mjs clipforge:ci
      - name: Publish tested image
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/clipforge"
          docker tag clipforge:ci "$image:$RELEASE_SHA"
          docker tag clipforge:ci "$image:latest"
          docker push "$image:$RELEASE_SHA"
          docker push "$image:latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy through Coolify and verify the release
        env:
          COOLIFY_APP_WEBHOOK: ${{ secrets.COOLIFY_APP_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/deploy.mjs
