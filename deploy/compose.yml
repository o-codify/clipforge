# One application container; PostgreSQL is an external, persistent service.
services:
  clipforge:
    image: ${CLIPFORGE_IMAGE:?Use the tested GHCR image tag}
    restart: unless-stopped
    stop_grace_period: 50s
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATA_ROOT: /storage/data
      OUT_ROOT: /storage/out
      MODELS_ROOT: /storage/models
    volumes:
      - clipforge-storage:/storage
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
volumes:
  clipforge-storage:
